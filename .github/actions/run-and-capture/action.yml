name: Run and Capture
description: >
  Wraps a command with structured CI markers for dashboard log extraction.
  Captures stdout+stderr, emits ##[CI-FAILURE-START/END] on failure,
  writes GitHub Step Summary, and preserves the exit code.

inputs:
  command:
    description: Shell command to run
    required: true
  step-name:
    description: Identifier for this step (used in markers and summary)
    required: true
  working-directory:
    description: Directory to run the command in
    required: false
    default: "."

outputs:
  exit-code:
    description: Exit code of the wrapped command
    value: ${{ steps.run.outputs.exit_code }}
  log-path:
    description: Path to the full captured output
    value: ${{ steps.run.outputs.log_path }}

runs:
  using: composite
  steps:
    - name: Run and capture
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        LOG_PATH="/tmp/ci_capture_${{ inputs.step-name }}_${{ github.run_id }}.log"
        echo "log_path=$LOG_PATH" >> "$GITHUB_OUTPUT"

        # ── Structured open marker ─────────────────────────────────────────
        # Dashboard uses this as an anchor — contains step name and run ID
        echo "##[CI-STEP-START] step=${{ inputs.step-name }} run=${{ github.run_id }} job=${{ github.job }}"

        # ── Run the actual command ─────────────────────────────────────────
        # tee: write to log file AND stdout (so it still appears in the log)
        # PIPESTATUS[0]: get exit code of the command, not tee
        set +e
        ${{ inputs.command }} 2>&1 | tee "$LOG_PATH"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        # ── Structured close marker ────────────────────────────────────────
        echo "##[CI-STEP-END] step=${{ inputs.step-name }} exit=$EXIT_CODE"

        # ── On failure: emit failure block and write step summary ──────────
        if [ "$EXIT_CODE" -ne 0 ]; then

          # Failure markers — dashboard extracts exactly this block
          echo "##[CI-FAILURE-START] step=${{ inputs.step-name }}"
          grep -E \
            "FAIL|--- FAIL:|panic:|Error:|error:|timed out|exit code|✖|Expected|Got:|FAILED" \
            "$LOG_PATH" | tail -30 || true
          echo "##[CI-FAILURE-END]"

          # GitHub Step Summary — visible in Actions UI and Checks API
          {
            echo "## ❌ \`${{ inputs.step-name }}\` failed (exit code $EXIT_CODE)"
            echo ""
            echo "### Failure signals"
            echo '```'
            grep -E \
              "FAIL|--- FAIL:|panic:|Error:|✖|FAILED|timed out" \
              "$LOG_PATH" | tail -20 || echo "(no pattern matched)"
            echo '```'
            echo ""
            echo "### Last 50 lines of output"
            echo '```'
            tail -50 "$LOG_PATH"
            echo '```'
            echo ""
            echo "_Run ID: ${{ github.run_id }} | Job: ${{ github.job }}_"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit "$EXIT_CODE"